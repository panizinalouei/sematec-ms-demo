{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}سامانه مدیریت یادگیری سماتک{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if messages %}
    <div class="messages">
      {% for m in messages %}
        <div class="toast {{ m.tags }}">
          <svg class="icon icon-sm" style="margin-top:3px"><use href="#i-check"/></svg>
          <div>{{ m }}</div>
        </div>
      {% endfor %}
    </div>
  {% endif %}
  {% block body %}{% endblock %}
  {% include "partials/icons.html" %}
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
